<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1120" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <style>
    .node{fill:#EAF1FF;stroke:#3B6FE0;stroke-width:2;}
    .node-t{fill:#16233B;font-size:13.5px;font-weight:600;text-anchor:middle;}
    .dia{fill:#FFF3D6;stroke:#E0A100;stroke-width:2;}
    .dia-t{fill:#5A4500;font-size:13px;font-weight:700;text-anchor:middle;}
    .start{fill:#E6F8EC;stroke:#23A455;stroke-width:2;}
    .end{fill:#E6F8EC;stroke:#23A455;stroke-width:2;}
    .fail{fill:#FCE8E8;stroke:#E04646;stroke-width:2;}
    .fail-t{fill:#9B1C1C;font-size:12px;font-weight:600;text-anchor:middle;}
    .branch{fill:#F0ECFF;stroke:#7A5BF0;stroke-width:2;}
    .branch-t{fill:#3A2A6B;font-size:12.5px;font-weight:600;text-anchor:middle;}
    .edge{fill:none;stroke:#8A93A8;stroke-width:2;}
    .lbl{fill:#6B7691;font-size:11px;text-anchor:middle;font-weight:600;}
    @media (prefers-color-scheme: dark){
      .node{fill:#1B2740;stroke:#5C8DF0;} .node-t{fill:#E6EDFF;}
      .dia{fill:#3A2F12;stroke:#E0A100;} .dia-t{fill:#FFE08A;}
      .start{fill:#16331F;stroke:#3FD17A;} .end{fill:#16331F;stroke:#3FD17A;}
      .fail{fill:#3A1717;stroke:#F06A6A;} .fail-t{fill:#FFB4B4;}
      .branch{fill:#2A2150;stroke:#9B7BF5;} .branch-t{fill:#D9CCFF;}
      .edge{stroke:#7C8AA8;} .lbl{fill:#A8B2C8;}
    }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8A93A8"/>
    </marker>
  </defs>

  <!-- ===== Edges (draw first so nodes sit on top) ===== -->
  <path class="edge" d="M250,58 L250,84" marker-end="url(#ar)"/>
  <path class="edge" d="M250,132 L250,158" marker-end="url(#ar)"/>
  <path class="edge" d="M250,206 L250,232" marker-end="url(#ar)"/>
  <path class="edge" d="M250,280 L250,284" marker-end="url(#ar)"/>
  <path class="edge" d="M250,376 L250,406" marker-end="url(#ar)"/>
  <path class="edge" d="M355,330 L545,330" marker-end="url(#ar)"/>
  <path class="edge" d="M250,462 L250,466" marker-end="url(#ar)"/>
  <path class="edge" d="M250,558 L250,596" marker-end="url(#ar)"/>
  <path class="edge" d="M355,512 L545,512" marker-end="url(#ar)"/>
  <path class="edge" d="M630,538 L630,580" marker-end="url(#ar)"/>
  <path class="edge" d="M630,660 L630,676" marker-end="url(#ar)"/>
  <path class="edge" d="M555,620 L430,620" marker-end="url(#ar)"/>
  <path class="edge" d="M145,700 L200,700" marker-end="url(#ar)"/>
  <path class="edge" d="M355,700 L545,700" marker-end="url(#ar)"/>
  <path class="edge" d="M110,724 L110,812 L70,812" marker-end="url(#ar)"/>
  <path class="edge" d="M630,724 L630,812 L430,812" marker-end="url(#ar)"/>
  <path class="edge" d="M250,836 L250,846" marker-end="url(#ar)"/>
  <path class="edge" d="M355,892 L545,892" marker-end="url(#ar)"/>
  <path class="edge" d="M250,938 L250,972" marker-end="url(#ar)"/>
  <path class="edge" d="M250,1024 L250,1052" marker-end="url(#ar)"/>

  <!-- edge labels -->
  <text class="lbl" x="452" y="322">否</text>
  <text class="lbl" x="450" y="504">否</text>
  <text class="lbl" x="650" y="672">否</text>
  <text class="lbl" x="392" y="610">是</text>
  <text class="lbl" x="172" y="692">视频</text>
  <text class="lbl" x="450" y="692">图集</text>
  <text class="lbl" x="452" y="884">是</text>
  <text class="lbl" x="262" y="962">否</text>

  <!-- ===== Nodes ===== -->
  <!-- N1 start -->
  <rect class="start" x="70" y="16" width="360" height="42" rx="21"/>
  <text class="node-t" x="250" y="42">① 用户触发「视频解析」</text>

  <!-- N2 -->
  <rect class="node" x="70" y="84" width="360" height="48" rx="10"/>
  <text class="node-t" x="250" y="103">② 进入等待状态</text>
  <text class="node-t" x="250" y="121">提示：发送视频链接（支持 20+ 平台）</text>

  <!-- N3 -->
  <rect class="node" x="70" y="158" width="360" height="48" rx="10"/>
  <text class="node-t" x="250" y="187">③ 用户 @机器人 发送视频链接</text>

  <!-- N4 -->
  <rect class="node" x="70" y="232" width="360" height="48" rx="10"/>
  <text class="node-t" x="250" y="261">④ 提取链接 → 识别平台 (_detect_platform)</text>

  <!-- D1 -->
  <polygon class="dia" points="250,284 355,330 250,376 145,330"/>
  <text class="dia-t" x="250" y="334">平台支持？</text>

  <!-- F1 -->
  <rect class="fail" x="545" y="306" width="170" height="48" rx="10"/>
  <text class="fail-t" x="630" y="325">✗ 暂不支持该链接</text>
  <text class="fail-t" x="630" y="343">→ 结束</text>

  <!-- N5 -->
  <rect class="node" x="70" y="406" width="360" height="56" rx="10"/>
  <text class="node-t" x="250" y="427">⑤ 调用小渡聚合解析 API</text>
  <text class="node-t" x="250" y="446" style="font-size:11px;font-weight:500;">openapi.dwo.cc/api/svparse?url=&amp;ckey=</text>

  <!-- D2 -->
  <polygon class="dia" points="250,466 355,512 250,558 145,512"/>
  <text class="dia-t" x="250" y="516">小渡解析成功？</text>

  <!-- FB branch -->
  <rect class="branch" x="545" y="486" width="170" height="52" rx="10"/>
  <text class="branch-t" x="630" y="506">回退：抖音 / B站</text>
  <text class="branch-t" x="630" y="524">专属解析器</text>

  <!-- D2c -->
  <polygon class="dia" points="630,580 705,620 630,660 555,620"/>
  <text class="dia-t" x="630" y="624" style="font-size:11px;">解析成功？</text>

  <!-- F2 -->
  <rect class="fail" x="545" y="676" width="170" height="48" rx="10"/>
  <text class="fail-t" x="630" y="695">✗ 解析失败</text>
  <text class="fail-t" x="630" y="713">→ 结束</text>

  <!-- N6 -->
  <rect class="node" x="70" y="596" width="360" height="48" rx="10"/>
  <text class="node-t" x="250" y="625">⑥ 取得解析结果（video / image）</text>

  <!-- D3 -->
  <polygon class="dia" points="250,654 355,700 250,746 145,700"/>
  <text class="dia-t" x="250" y="704">返回类型？</text>

  <!-- V1 left -->
  <rect class="branch" x="20" y="676" width="180" height="48" rx="10"/>
  <text class="branch-t" x="110" y="695">🎬 视频直链</text>
  <text class="branch-t" x="110" y="713">B站 CDN 加 Referer</text>

  <!-- I1 right -->
  <rect class="branch" x="545" y="676" width="170" height="48" rx="10"/>
  <text class="branch-t" x="630" y="695">🖼️ 图集 images[]</text>
  <text class="branch-t" x="630" y="713">（小红书等）</text>

  <!-- N7 -->
  <rect class="node" x="70" y="788" width="360" height="48" rx="10"/>
  <text class="node-t" x="250" y="817">⑦ 时长 + 大小限制检查（后台配置, 0=不限制）</text>

  <!-- D4 -->
  <polygon class="dia" points="250,846 355,892 250,938 145,892"/>
  <text class="dia-t" x="250" y="896">超限？</text>

  <!-- F3 -->
  <rect class="fail" x="545" y="868" width="170" height="48" rx="10"/>
  <text class="fail-t" x="630" y="887">✗ 超出时长 / 大小</text>
  <text class="fail-t" x="630" y="905">→ 结束</text>

  <!-- N8 -->
  <rect class="node" x="70" y="972" width="360" height="52" rx="10"/>
  <text class="node-t" x="250" y="993">⑧ 发送：视频→下载字节上传</text>
  <text class="node-t" x="250" y="1011">图集→逐张发送（≤9 张）</text>

  <!-- N9 end -->
  <rect class="end" x="70" y="1052" width="360" height="44" rx="22"/>
  <text class="node-t" x="250" y="1079">⑨ 回复：视频解析成功！平台：xxx</text>
</svg>
